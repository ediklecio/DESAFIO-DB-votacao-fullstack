server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Same-origin API calls: the browser hits /api/..., nginx forwards to the
    # "api" compose service, so no CORS configuration is needed on the backend.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Hashed build assets can be cached for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: every client-side route is served by index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
