spring.application.name=vote

# RN08/RNF10: connection data comes from environment variables (loaded from
# .env by docker-compose), never hardcoded here.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vote}
spring.datasource.username=${DB_USER:vote}
spring.datasource.password=${DB_PASSWORD:vote}

# Flyway owns the schema; Hibernate only validates entity mappings against it.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.out-of-order=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
